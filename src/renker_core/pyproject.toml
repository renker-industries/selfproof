[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renker-core"
version = "0.2.0"
description = "Shared foundation (identity, permissions, audit, policy) for the Renker platform"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "Sebastian Renker" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["renker_core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["renker_core"]
ignore_missing_imports = true
warn_unused_ignores = false
