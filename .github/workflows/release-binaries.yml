# Build the single-file `selfproof` binary on each OS and publish them to the
# repository's Releases page, so people find the download in the normal place
# instead of digging through Actions artifacts. Runs on a version tag or on
# demand. No secrets beyond the built-in token.
name: release-binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release and attach the binaries

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: selfproof-linux
          - os: macos-latest
            asset: selfproof-macos
          - os: windows-latest
            asset: selfproof-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --quiet pyinstaller

      - name: Build binary
        run: pyinstaller packaging/selfproof.spec --distpath dist --workpath build/pyi --noconfirm

      - name: Rename to a per-OS asset name
        shell: bash
        run: |
          if [ -f dist/selfproof.exe ]; then mv dist/selfproof.exe "dist/${{ matrix.asset }}"; \
          else mv dist/selfproof "dist/${{ matrix.asset }}"; fi

      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} status || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release with the binaries attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/selfproof-linux dist/selfproof-macos dist/selfproof-windows.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Selfproof ${GITHUB_REF_NAME}" \
            --notes "Download the binary for your OS below. See the install scripts and docs/site for one-line installation."
