# Build the single-file `selfproof` binary on each OS, plus a Windows installer
# wizard (Inno Setup), and publish them to the repository's Releases page so the
# download is visible in the normal place. Runs on a version tag or on demand.
name: release-binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the GitHub Release and attach the files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: selfproof-linux
          - os: macos-latest
            asset: selfproof-macos
          - os: windows-latest
            asset: selfproof-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --quiet pyinstaller

      - name: Build binary
        run: pyinstaller packaging/selfproof.spec --distpath dist --workpath build/pyi --noconfirm

      - name: Rename to a per-OS asset name
        shell: bash
        run: |
          if [ -f dist/selfproof.exe ]; then mv dist/selfproof.exe "dist/${{ matrix.asset }}"; \
          else mv dist/selfproof "dist/${{ matrix.asset }}"; fi

      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} status || true

      - name: Build Windows installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = ($env:GITHUB_REF_NAME -replace '^v','')
          if (-not $ver) { $ver = "0.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\selfproof.iss

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: Upload Windows installer artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Selfproof_Setup.exe
          path: installer/Output/Selfproof_Setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub Release with the binaries and installer attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Selfproof_Setup.exe \
            dist/selfproof-windows.exe dist/selfproof-macos dist/selfproof-linux \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Selfproof ${GITHUB_REF_NAME}" \
            --notes "Windows: run Selfproof_Setup.exe. macOS/Linux: download the binary or use the one-line installer. See the README."
