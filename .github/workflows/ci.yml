# CI: verify only. Never runs an agent, never uses secrets.
# Trigger: push to main and pull requests from this repository.
# Permissions: read-only token (contents: read).
# Note: actions are pinned by tag in the seed; SHA-pinning is a Phase 8
# hardening task tracked in docs/reports/OWNER_TODO.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: python -m pip install --quiet pytest ruff mypy hypothesis

      - name: Kernel and Selfproof tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Check generated rules files are current
        env:
          PYTHONPATH: src
        run: python -m selfproof.cli rules check

      - name: Run gates (proof + language) and record evidence
        env:
          PYTHONPATH: src
        run: python -m selfproof.cli build

      - name: Verify the evidence ledger
        env:
          PYTHONPATH: src
        run: python -m selfproof.cli ledger verify

  install-smoke:
    # Install the package into a clean virtualenv from a fresh checkout, with no
    # PYTHONPATH tricks, and run the CLI. This catches a broken `pip install`
    # (e.g. the kernel package shadowing) that the PyInstaller binary would hide.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install into a clean virtualenv
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install --quiet --upgrade pip
          ./.venv/bin/python -m pip install .

      - name: Smoke test the installed CLI (no PYTHONPATH)
        run: |
          ./.venv/bin/selfproof --help
          ./.venv/bin/selfproof status
          ./.venv/bin/selfproof build --gates language
