# CI: verify only. Never runs an agent, never uses secrets.
# Trigger: push to main and pull requests from this repository.
# Permissions: read-only token (contents: read).
# Note: actions are pinned by tag in the seed; SHA-pinning is a Phase 8
# hardening task tracked in docs/reports/OWNER_TODO.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev tools
        run: python -m pip install --quiet pytest ruff mypy hypothesis

      - name: Kernel and Selfproof tests
        env:
          PYTHONPATH: src:src/renker_core
        run: python -m pytest -q

      - name: Run gates (proof + language) and record evidence
        env:
          PYTHONPATH: src:src/renker_core
        run: python -m selfproof.cli build

      - name: Verify the evidence ledger
        env:
          PYTHONPATH: src:src/renker_core
        run: python -m selfproof.cli ledger verify
